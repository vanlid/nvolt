name: Build and Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  GO_VERSION: "1.24.3"

jobs:
  # Compute the version ONCE so the injected binary version and the release
  # title can never drift apart.
  version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      is_dev: ${{ steps.compute.outputs.is_dev }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history + tags so `git describe` can see the release tags.
          fetch-depth: 0

      - name: Compute version
        id: compute
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9] ]]; then
            # Tagged release: use the tag verbatim.
            VERSION="${GITHUB_REF#refs/tags/}"
            IS_DEV=false
          else
            # Dev build. Base ONLY on full release tags (vX.Y.Z): --match keeps
            # v-number tags and drops the rolling 'dev' tag; --exclude '*-*'
            # additionally drops pre-release tags like v0.2.0-rc1. SemVer-correct:
            # bump the patch and mark it a pre-release so the dev build sorts
            # AFTER the last release (v1.0.25) and before the next (v1.0.26).
            DESC=$(git describe --tags --long --match 'v[0-9]*' --exclude '*-*' 2>/dev/null || true)
            if [[ "$DESC" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)-([0-9]+)-(g[0-9a-f]+)$ ]]; then
              NEXT_PATCH=$(( ${BASH_REMATCH[3]} + 1 ))
              VERSION="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${NEXT_PATCH}-dev.${BASH_REMATCH[4]}.${BASH_REMATCH[5]}"
            else
              # No release tag anywhere in history.
              VERSION="v0.0.0-dev.0.g${GITHUB_SHA::7}"
            fi
            IS_DEV=true
          fi
          echo "Computed version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_dev=$IS_DEV" >> "$GITHUB_OUTPUT"

  build:
    name: Build binaries
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Linux
          - goos: linux
            goarch: amd64
            output: nvolt-linux-amd64
          - goos: linux
            goarch: arm64
            output: nvolt-linux-arm64
          # macOS
          - goos: darwin
            goarch: amd64
            output: nvolt-darwin-amd64
          - goos: darwin
            goarch: arm64
            output: nvolt-darwin-arm64
          # Windows
          - goos: windows
            goarch: amd64
            output: nvolt-windows-amd64.exe
          - goos: windows
            goarch: arm64
            output: nvolt-windows-arm64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          go build -trimpath -ldflags="-s -w -X github.com/iluxav/nvolt/internal/cli.version=${VERSION}" -o ${{ matrix.output }} cmd/nvolt/main.go

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}
          retention-days: 1

  upload-to-r2:
    name: Upload binaries to R2
    needs: [version, build]
    # Only tagged releases (v*) go to R2. Dev builds (workflow_dispatch) publish
    # to GitHub Releases instead — see the github-release job below.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./binaries

      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone for R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = ${R2_ENDPOINT}
          acl = private
          EOF

      - name: Upload binaries + checksums to R2
        env:
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # Flatten binaries + include the install script, then checksum.
          mkdir -p upload
          find ./binaries -type f -exec mv {} ./upload/ \;
          cp install.sh upload/install.sh
          chmod +x upload/install.sh
          (cd upload && sha256sum * > SHA256SUMS)

          # This job only runs on tags, so publish to both the version dir and
          # the rolling 'latest/' prefix.
          for f in ./upload/*; do
            rclone copy "$f" "r2:${R2_BUCKET_NAME}/${VERSION}/" --s3-no-check-bucket --progress
            rclone copy "$f" "r2:${R2_BUCKET_NAME}/latest/" --s3-no-check-bucket --progress
          done
          echo "All binaries uploaded to R2."

  github-release:
    name: Publish binaries to GitHub Releases
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./binaries

      - name: Collect binaries + checksums
        run: |
          mkdir -p upload
          find ./binaries -type f -exec mv {} ./upload/ \;
          cp install.sh upload/install.sh
          chmod +x upload/install.sh
          (cd upload && sha256sum * > SHA256SUMS)

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          IS_DEV: ${{ needs.version.outputs.is_dev }}
        run: |
          if [[ "$IS_DEV" == "false" ]]; then
            # Tagged release: publish under the tag; pre-release for any tag
            # carrying a pre-release suffix (e.g. v0.2.0-rc1).
            PRERELEASE=""
            [[ "$VERSION" == *-* ]] && PRERELEASE="--prerelease"
            gh release create "$VERSION" ./upload/* \
              --title "$VERSION" --generate-notes $PRERELEASE
          else
            # workflow_dispatch: a single rolling "dev" pre-release. The TAG stays
            # "dev" (stable URL, re-pointed at the built commit each run); the
            # TITLE carries the full SemVer dev version, matching `nvolt version`.
            gh release delete dev --yes --cleanup-tag 2>/dev/null || true
            gh release create dev ./upload/* \
              --target "$GITHUB_SHA" \
              --title "$VERSION" \
              --prerelease \
              --notes "Rolling development build \`${VERSION}\` (commit \`${GITHUB_SHA}\`) — not a stable release. The \`dev\` tag always points at the newest dev build."
          fi
