name: Build and Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  GO_VERSION: "1.24.3"
  # llvm-mingw release used to cross-build the windows-arm64 embedded PKCS#11
  # module (clang-based mingw toolchain; ships its own aarch64-w64-mingw32-gcc
  # wrapper). Bump deliberately — this is the least-tested cross target.
  LLVM_MINGW_VERSION: "20260616"
  # Prebuilt aarch64 musl cross toolchain used for the nvolt-tpm linux-arm64
  # fully-static build (apt has no arm64 musl cross package).
  MUSL_CROSS_URL: "https://musl.cc/aarch64-linux-musl-cross.tgz"

jobs:
  build:
    name: Build ${{ matrix.output }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---------------------------------------------------------------
          # Variant 1: default static, software-only. No build tags,
          # CGO_ENABLED=0. This is the original 6-target matrix, unchanged.
          # ---------------------------------------------------------------
          - variant: static
            goos: linux
            goarch: amd64
            output: nvolt-linux-amd64
          - variant: static
            goos: linux
            goarch: arm64
            output: nvolt-linux-arm64
          - variant: static
            goos: darwin
            goarch: amd64
            output: nvolt-darwin-amd64
          - variant: static
            goos: darwin
            goarch: arm64
            output: nvolt-darwin-arm64
          - variant: static
            goos: windows
            goarch: amd64
            output: nvolt-windows-amd64.exe
          - variant: static
            goos: windows
            goarch: arm64
            output: nvolt-windows-arm64.exe

          # ---------------------------------------------------------------
          # Variant 2: pkcs11 dynamic. -tags pkcs11 (cgo-free, CGO_ENABLED=0).
          # On the TPM targets (linux + windows) also embed the wolfPKCS11
          # module built by build/pkcs11/build-module.sh, via the extra
          # wolfpkcs11_embed tag. Darwin has no TPM, so pkcs11 only.
          # ---------------------------------------------------------------
          - variant: pkcs11
            goos: linux
            goarch: amd64
            output: nvolt-linux-amd64-pkcs11
            tags: "pkcs11 wolfpkcs11_embed"
            pkcs11_target: linux-amd64
            cross_setup: "" # native gcc/make already on the runner
          - variant: pkcs11
            goos: linux
            goarch: arm64
            output: nvolt-linux-arm64-pkcs11
            tags: "pkcs11 wolfpkcs11_embed"
            pkcs11_target: linux-arm64
            cross_setup: arm64-gnu
          - variant: pkcs11
            goos: windows
            goarch: amd64
            output: nvolt-windows-amd64-pkcs11.exe
            tags: "pkcs11 wolfpkcs11_embed"
            pkcs11_target: windows-amd64
            cross_setup: mingw64
          - variant: pkcs11
            goos: windows
            goarch: arm64
            output: nvolt-windows-arm64-pkcs11.exe
            tags: "pkcs11 wolfpkcs11_embed"
            pkcs11_target: windows-arm64
            cross_setup: llvm-mingw
          - variant: pkcs11
            goos: darwin
            goarch: amd64
            output: nvolt-darwin-amd64-pkcs11
            tags: "pkcs11"
            pkcs11_target: "" # no TPM on macOS -> no embedded module
            cross_setup: ""
          - variant: pkcs11
            goos: darwin
            goarch: arm64
            output: nvolt-darwin-arm64-pkcs11
            tags: "pkcs11"
            pkcs11_target: ""
            cross_setup: ""

          # ---------------------------------------------------------------
          # Variant 3: nvolt-tpm, fully-static cgo binary (musl libc), Linux
          # only. wolfSSL/wolfTPM/wolfPKCS11 built as static archives and
          # linked in with -tags wolfpkcs11_static, CGO_ENABLED=1.
          # ---------------------------------------------------------------
          - variant: tpm
            goos: linux
            goarch: amd64
            output: nvolt-tpm-linux-amd64
            cross_setup: musl-native
            musl_cc: musl-gcc
          - variant: tpm
            goos: linux
            goarch: arm64
            output: nvolt-tpm-linux-arm64
            cross_setup: musl-arm64
            musl_cc: aarch64-linux-musl-gcc

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # -----------------------------------------------------------------
      # Cross-toolchain / build-dependency installation (pkcs11 + tpm only)
      # -----------------------------------------------------------------
      - name: Install autotools + apt cross toolchain
        if: matrix.variant != 'static'
        env:
          CROSS_SETUP: ${{ matrix.cross_setup }}
        run: |
          set -euo pipefail
          sudo apt-get update
          PKGS="autoconf automake libtool"
          case "$CROSS_SETUP" in
            arm64-gnu)   PKGS="$PKGS gcc-aarch64-linux-gnu" ;;
            mingw64)     PKGS="$PKGS gcc-mingw-w64-x86-64" ;;
            musl-native) PKGS="$PKGS musl-tools" ;;
            *) ;; # llvm-mingw / musl-arm64 / native / darwin: toolchain installed by a later step (or none needed)
          esac
          sudo apt-get install -y $PKGS

      - name: Install llvm-mingw (windows-arm64 pkcs11 cross toolchain)
        if: matrix.cross_setup == 'llvm-mingw'
        run: |
          set -euo pipefail
          asset="llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64.tar.xz"
          curl -fsSL -o /tmp/llvm-mingw.tar.xz \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/${asset}"
          sudo tar -xJf /tmp/llvm-mingw.tar.xz -C /opt
          echo "/opt/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64/bin" >> "$GITHUB_PATH"

      - name: Install musl cross toolchain (nvolt-tpm linux-arm64)
        if: matrix.cross_setup == 'musl-arm64'
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/musl-cross.tgz "$MUSL_CROSS_URL"
          sudo tar -xzf /tmp/musl-cross.tgz -C /opt
          echo "/opt/aarch64-linux-musl-cross/bin" >> "$GITHUB_PATH"

      # -----------------------------------------------------------------
      # Build the embedded wolfPKCS11 module (pkcs11 variant, TPM targets)
      # -----------------------------------------------------------------
      - name: Build embedded wolfPKCS11 module
        if: matrix.variant == 'pkcs11' && matrix.pkcs11_target != ''
        env:
          TARGET: ${{ matrix.pkcs11_target }}
        run: |
          set -euo pipefail
          TARGET="$TARGET" build/pkcs11/build-module.sh

      # -----------------------------------------------------------------
      # Build static wolfSSL/wolfTPM/wolfPKCS11 archives (nvolt-tpm variant)
      # -----------------------------------------------------------------
      - name: Build static wolfPKCS11 archives (musl)
        if: matrix.variant == 'tpm'
        env:
          CC: ${{ matrix.musl_cc }}
        run: |
          set -euo pipefail
          STATIC_ARCHIVES=internal/pkcs11/dist/static TPM_INTERFACE=devtpm build/pkcs11/build-module.sh /dev/null

      # -----------------------------------------------------------------
      # Build the Go binary
      # -----------------------------------------------------------------
      - name: Build binary
        if: matrix.variant != 'tpm'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          BUILD_TAGS: ${{ matrix.tags }}
          OUTPUT: ${{ matrix.output }}
        run: |
          set -euo pipefail
          # Extract version from git tag (remove 'v' prefix if present)
          VERSION=${GITHUB_REF#refs/tags/}
          if [[ ! "$VERSION" =~ ^v[0-9] ]]; then
            VERSION="dev"
          fi

          TAGS_ARGS=()
          if [ -n "$BUILD_TAGS" ]; then
            TAGS_ARGS=(-tags "$BUILD_TAGS")
          fi

          go build -trimpath "${TAGS_ARGS[@]}" -ldflags="-s -w -X github.com/iluxav/nvolt/internal/cli.version=${VERSION}" -o "$OUTPUT" cmd/nvolt/main.go

      - name: Build nvolt-tpm binary (static musl, cgo)
        if: matrix.variant == 'tpm'
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CC: ${{ matrix.musl_cc }}
          OUTPUT: ${{ matrix.output }}
        run: |
          set -euo pipefail
          VERSION=${GITHUB_REF#refs/tags/}
          if [[ ! "$VERSION" =~ ^v[0-9] ]]; then
            VERSION="dev"
          fi

          go build -trimpath -tags "wolfpkcs11_static netgo osusergo" \
            -ldflags="-s -w -X github.com/iluxav/nvolt/internal/cli.version=${VERSION} -linkmode external -extldflags \"-static\"" \
            -o "$OUTPUT" cmd/nvolt/main.go

      - name: Verify nvolt-tpm is statically linked
        if: matrix.variant == 'tpm'
        env:
          OUTPUT: ${{ matrix.output }}
        run: |
          set -euo pipefail
          file "$OUTPUT"
          file "$OUTPUT" | grep -q "statically linked"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}
          retention-days: 1

  upload-to-r2:
    name: Upload binaries to R2
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./binaries

      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone for R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = ${R2_ENDPOINT}
          acl = private
          EOF

      - name: Upload binaries to R2
        env:
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          # Get version from tag or use 'latest'
          VERSION=${GITHUB_REF#refs/tags/}
          if [[ ! "$VERSION" =~ ^v[0-9] ]]; then
            VERSION="latest"
          fi

          # Move all binaries to a flat structure
          mkdir -p upload
          find ./binaries -type f -exec mv {} ./upload/ \;

          # Copy install script
          cp install.sh upload/install.sh
          chmod +x upload/install.sh

          # Upload each binary to R2
          for binary in ./upload/*; do
            filename=$(basename "$binary")
            echo "Uploading $filename to R2..."

            # Upload with version
            rclone copy "$binary" "r2:${R2_BUCKET_NAME}/${VERSION}/" --s3-no-check-bucket --progress

            # Also upload to 'latest' if this is a tagged release
            if [[ "$VERSION" =~ ^v[0-9] ]]; then
              rclone copy "$binary" "r2:${R2_BUCKET_NAME}/latest/" --s3-no-check-bucket --progress
            fi
          done

          echo "All binaries uploaded successfully!"

      - name: Generate checksums
        run: |
          cd upload
          sha256sum * > SHA256SUMS

      - name: Upload checksums to R2
        env:
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          if [[ ! "$VERSION" =~ ^v[0-9] ]]; then
            VERSION="latest"
          fi

          rclone copy upload/SHA256SUMS "r2:${R2_BUCKET_NAME}/${VERSION}/" --s3-no-check-bucket --progress

          if [[ "$VERSION" =~ ^v[0-9] ]]; then
            rclone copy upload/SHA256SUMS "r2:${R2_BUCKET_NAME}/latest/" --s3-no-check-bucket --progress
          fi
